[package]
name = "infrix-types"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Core types for Infrix smart contracts"
repository = "https://github.com/opendlt/infrix-crates"
keywords = ["accumulate", "smart-contracts", "wasm", "blockchain"]
categories = ["cryptography", "wasm"]

[lib]
crate-type = ["rlib"]

[features]
default = ["std"]
std = ["serde/std"]
alloc = ["serde/alloc"]

[dependencies]
# The one dependency: serde, for the governance types' wire form (IntentGoal and
# the generated IntentPriority travel as the node's JSON). Without its default
# features serde is no_std; its std/alloc support follows this crate's features.
serde = { version = "1", default-features = false, features = ["derive"] }

[dev-dependencies]
# Reads the vendored goal-vocabulary.json (tests/goal_vocabulary.rs).
serde_json = "1"
